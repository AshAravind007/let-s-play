<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Classic — Let's Play</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .bingo-wrapper {
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px;
      text-align: center;
    }
    .letters-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .letter-box {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }
    .letter-box.active {
      color: var(--accent);
      text-shadow: 0 0 12px rgba(99, 102, 241, 0.8);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .cell {
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cell:hover {
      border-color: var(--border-glow);
      transform: scale(1.03);
    }
    .cell.selected {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>

  <div class="bingo-wrapper">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
      <h2>Bingo Classic</h2>
      <a href="../index.html" class="btn btn-secondary" style="padding:6px 14px; font-size:0.85rem;">Exit</a>
    </div>

    <!-- B-I-N-G-O STRIKE TRACKER -->
    <div class="letters-row">
      <div id="let-0" class="letter-box">B</div>
      <div id="let-1" class="letter-box">I</div>
      <div id="let-2" class="letter-box">N</div>
      <div id="let-3" class="letter-box">G</div>
      <div id="let-4" class="letter-box">O</div>
    </div>

    <!-- 5x5 BOARD -->
    <div id="bingoGrid" class="grid"></div>
  </div>

  <script>
    let board = [];
    let selected = Array(25).fill(false);

    function initBoard() {
      const numbers = Array.from({length: 25}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
      board = numbers;
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';

      numbers.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerText = val;
        cell.onclick = () => toggleCell(idx, cell);
        grid.appendChild(cell);
      });
    }

    function toggleCell(idx, cell) {
      selected[idx] = !selected[idx];
      cell.classList.toggle('selected', selected[idx]);
      evaluateLines();
    }

    function evaluateLines() {
      let lines = 0;

      // 5 Rows
      for (let r = 0; r < 5; r++) {
        if ([0,1,2,3,4].every(c => selected[r * 5 + c])) lines++;
      }
      // 5 Columns
      for (let c = 0; c < 5; c++) {
        if ([0,1,2,3,4].every(r => selected[r * 5 + c])) lines++;
      }
      // 2 Diagonals
      if ([0, 6, 12, 18, 24].every(i => selected[i])) lines++;
      if ([4, 8, 12, 16, 20].every(i => selected[i])) lines++;

      for (let i = 0; i < 5; i++) {
        document.getElementById(`let-${i}`).classList.toggle('active', i < lines);
      }

      if (lines >= 5) {
        setTimeout(() => alert('🎉 B-I-N-G-O! You completed 5 lines!'), 200);
      }
    }

    initBoard();
  </script>
</body>
</html>
